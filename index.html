<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         real values. Without it the scoreboard sits under the iPad clock,
         because the status bar is black-translucent (see below). -->
    <!-- maximum-scale + user-scalable=no turn off pinch-zoom. Safari ignores
         these in a normal tab, but honours them for an installed Home Screen
         app, which is how teachers run this. The JS in src/main.tsx blocks the
         gesture events as a second line of defence. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>Griffin Grader</title>
    <meta
      name="description"
      content="Attendance and rubric grading for PE classes. Works offline."
    />
    <meta name="theme-color" content="#0B1F3A" />

    <!-- iPadOS home-screen app tags. Installing to the Home Screen is what
         keeps the data safe: iOS can clear storage for a site that only ever
         lives in a Safari tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Griffin Grader" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
